<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ title if title else "Flask App" }}</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
{% if request.args.get('layout') == 'right-split' %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/right-split.css') }}">
{% endif %}
</head>
<body>
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>
  <script defer src="{{ url_for('static', filename='vendor/jquery/jquery-3.6.0.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% if request.args.get('layout') == 'right-split' %}
  <script defer src="{{ url_for('static', filename='js/right-split.js') }}"></script>
  {% endif %}
</body>
</html>
